name: Publish

# npm Trusted Publishing（OIDC）：一次性前置是在 npm 网页给本包配置
# Trusted Publisher（owner Visdenda、repo ai-crawler-directory、workflow publish.yml）。
# tag 由私有 monorepo 的镜像 workflow 在版本号变化时打；--provenance 只在公开仓可用。
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Check npm CLI floor (trusted publishing needs >= 11.5.1)
        run: |
          npmv=$(npm --version)
          echo "node $(node --version) / npm $npmv"
          node -e "const [a,b]=process.argv[1].split('.').map(Number); if (a<11||(a===11&&b<5)) { console.error('npm '+process.argv[1]+' < 11.5.1: trusted publishing will fail'); process.exit(1); }" "$npmv"
      - run: npm ci
      - run: npm run build
      - run: npm run build:data
      - run: npm test
      - run: npm publish --provenance --access public
